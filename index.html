/* Minimal dark editorial redesign — intentionally flat and quiet. */
:root{
  color-scheme:dark;
  --navy:#0b0c0e;--navy2:#101215;
  --blue:#89b4f4;--blueBg:#1a2534;
  --text:#f0f2f4;--muted:#929aa5;
  --line:#2a2d32;--bg:#0b0d10;--white:#141619;
  --green:#74caaa;--amber:#e5ba73;--red:#ee8990;--purple:#b5a5e1;
  --radius:12px;--shadow:none;
}
html{background:var(--bg)}
body{
  color:var(--text);background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.55;
}
body::before{display:none}
a{color:var(--blue)}
.app{position:relative}
.side{
  width:244px;background:#090a0c;color:#a6abb4;
  border-right:1px solid #24272c;box-shadow:none;
}
.brand{padding:29px 24px 28px;gap:12px}
.brand-logo{
  width:35px;height:35px;border-radius:9px;background:#1c2838;
  color:#bdd4f9;box-shadow:none;font-size:12px;letter-spacing:-.2px;
  border:1px solid #304057;
}
.brand strong{color:#f2f3f5;font-size:12px;letter-spacing:1.15px;font-weight:770}
.brand small{color:#808893;font-size:9px;letter-spacing:1.7px}
.nav-section{color:#69717b;font-size:10px;letter-spacing:1.45px;padding:20px 23px 9px}
.nav{padding:0 11px;gap:3px}
.nav button{
  background:transparent;border:1px solid transparent;color:#a3aab4;
  border-radius:8px;padding:10px 12px;gap:12px;font-size:13px;
  font-weight:550;transition:background .15s,color .15s;
}
.nav button svg{width:17px;height:17px;opacity:.9}
.nav button:hover{background:#171a1f;color:#f5f5f6;border-color:transparent}
.nav button.active{
  background:#1b1f25;color:#f7f8fa;border:1px solid #2a3038;
  box-shadow:none;font-weight:670;
}
.nav button.active svg{color:#a5c3f1;opacity:1}
.side-bottom{padding:16px 13px 19px}
.side-note{
  background:#101215;border:1px solid #292d33;color:#959ca7;
  border-radius:10px;padding:13px 12px;font-size:11px;line-height:1.55;
}
.side-note strong{color:#dadee4;font-size:11px}
.side-user{margin-top:17px;border-top:1px solid #24272c;padding:17px 5px 0}
.side-user b{color:#f4f5f6}.side-user span{color:#818a96}
.avatar{
  border:1px solid #384354;border-radius:9px;background:#222b38;
  color:#c6d7ef;box-shadow:none;
}
.topbar{
  height:72px;background:#0d0f12;border-bottom:1px solid #25292e;
  backdrop-filter:none;box-shadow:none;padding:0 34px;
}
.topbar h1{color:#e3e7eb;font-size:14px;font-weight:690}
.crumb{color:#7e8997;font-size:10px;letter-spacing:.9px;font-weight:660}
.top-actions{gap:10px}
.top-select,.icon-btn{
  background:#15181c;border:1px solid #2c3036;color:#dce3eb;
  border-radius:9px;box-shadow:none;
}
.top-select{font-size:12px;padding:8px 10px}
.icon-btn:hover{background:#20242a;border-color:#3b424a;transform:none}
.content{max-width:1510px;padding:33px 35px 70px}
.head{margin-bottom:25px;gap:18px}
.eyebrow{color:#94a5b9;font-size:10px;letter-spacing:1.25px;font-weight:730}
.head h2{color:#f4f5f7;font-size:28px;letter-spacing:-.9px;font-weight:720;margin:4px 0 3px}
.sub{font-size:13px;color:var(--muted)}
.actions{gap:9px}
.btn{
  background:#191c20;border:1px solid #30343a;color:#dee4ea;
  border-radius:9px;box-shadow:none;font-weight:640;padding:9px 13px;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:#23272c;border-color:#414852;transform:none}
.btn.primary{
  background:#396dbb;border:1px solid #437ccf;color:#fff;box-shadow:none;
}
.btn.primary:hover{background:#447dce;border-color:#5287d6}
.btn.dark{background:#21252a;color:#f1f4f8;border-color:#30353d}
.btn.danger{background:#231719;color:#f2aaa9;border-color:#493034}
.btn.small{font-size:12px}
.card{
  background:#141619;border:1px solid #282c31;
  border-radius:12px;box-shadow:none;padding:22px;
}
.card h3{font-weight:690;font-size:14px;color:#eaedf1;letter-spacing:-.15px}
.card-header{margin-bottom:19px}
.card-header p{color:var(--muted);font-size:12px}
.grid{gap:15px}.two-columns,.right-col{gap:15px}
.metric{min-height:129px;padding:19px 20px;border-color:#2a2e34}
.metric .label{color:#a1a9b3;font-size:12px;font-weight:570}
.metric .value{color:#f0f3f6;font-size:30px;line-height:1.45;letter-spacing:-1px;font-weight:720}
.metric .hint{font-size:11px;color:#828c99}
.metric .sym{
  background:transparent;border:0;color:#8994a3;
  box-shadow:none;width:28px;height:28px;
}
.metric .sym svg{height:17px;width:17px;opacity:.84}
.section{margin-top:16px}
.divider{background:var(--line)}
.week-card{
  padding:13px 14px;background:#1b1e22;border:1px solid #252a2f;
  border-radius:9px;box-shadow:none;
}
.week-card small{color:#98a1ac}
.week-card strong{color:#edf0f4;font-size:20px;font-weight:700}
.progress,.chartbar{background:#2a2e32;height:7px;border-radius:99px}
.progress>div,.chartbar span{border-radius:99px}
.bar-green{background:#66bea0}.bar-amber{background:#e0ae66}
.bar-red{background:#e37d85}.bar-blue{background:#789fe2}.bar-purple{background:#aa99d8}
.task-line,.proj-row{border-bottom-color:var(--line)}
.task-line b,.project-title{color:#e5e9ee;font-weight:670}
.task-line small{color:#909aa6}
.clickable:hover{color:#a9c9f8}
.data-table th,.work-matrix th{
  background:#191c20;color:#929ba6;border-bottom:1px solid #30343a;
  font-size:10px;letter-spacing:.75px;
}
.data-table td,.work-matrix td{border-bottom:1px solid #292d32;color:#dfe4e9}

bell')}</button></div></header><main class="content">${db.settings.demo?`<div class="demo-banner"><span><b>MODO EJEMPLO</b> · Los registros precargados son ilustrativos. Puedes editarlos o comenzar con una base vacía.</span><button class="mini-link" data-action="clear-demo">Empezar desde cero</button></div>`:''}${({dashboard:renderDashboard,my:renderMy,tasks:renderTasks,projects:renderProjects,team:renderTeam,calendar:renderCalendar,meetings:renderMeetings,reports:renderReports,users:renderUsers,settings:renderSettings}[ui.view]||renderMy)()}</main></div></div>`;

const filteredTasks=()=>db.tasks.filter(t=>(!ui.search||[t.title,t.description,memberName(t.ownerId),projectName(t.projectId)].join(' ').toLowerCase().includes(ui.search.toLowerCase()))&&(!ui.status||t.status===ui.status)&&(!ui.owner||t.ownerId===ui.owner)&&(!ui.project||t.projectId===ui.project)&&(!ui.priority||t.priority===ui.priority)).sort((a,b)=>(overdue(b)-overdue(a))||((a.due||'9999').localeCompare(b.due||'9999')));

function renderMy(){let m=currentMember(),tasks=db.tasks.filter(t=>t.ownerId===m?.id&&active(t)),w=ui.week,h=m?loadHours(m.id,w):0,c=m?capacity(m,w):0,r=ratio(h,c);return `${head('ESPACIO INDIVIDUAL',`Mi trabajo · ${esc(m?.name||'Sin integrante')}`,ui.preview?'Previsualización del espacio del ingeniero. No son permisos reales ni inicio de sesión.':'Vista personal del perfil seleccionado. El acceso real requiere conectar autenticación.',btn(ic('plus')+' Nuevo pendiente','new-task','primary')+btn('Registrar soporte','new-support')+(!ui.preview&&adminMember()?btn('Mi perfil administrador','my-profile','small'):'')+(!ui.preview&&m?btn('Conectar Outlook','outlook-connect:'+m.id,'small'):''))}<div class="grid g4">${metricCard('Mis actividades',tasks.length,'Asignadas a este perfil','tasks','#2563db')}${metricCard('Vencidas',tasks.filter(overdue).length,'Compromisos pendientes','alert','#c94048')}${metricCard('Horas de proyectos',h+' h',`Disponibles: ${c} h`,'clock','#bd741c')}${metricCard('Carga semanal',r+'%',`Semana ${niceWeek(w)}`,'team','#18865b')}</div><div class="section two-columns"><section class="card"><div class="card-header"><div><h3>Mis compromisos</h3><p>Ordenados por fecha y urgencia</p></div>${sb(tasks.length+' activos','blue')}</div>${taskTable(tasks)}</section><div class="right-col"><section class="card"><div class="card-header"><h3>Mi capacidad semanal</h3>${loadBadge(r)}</div><div class="between"><b>${h} / ${c} horas</b><span class="muted mini">${r}%</span></div><div class="progress" style="margin-top:11px"><div class="${barColor(r)}" style="width:${Math.min(r,100)}%"></div></div><p class="muted mini">${r>100?'Carga planificada superior a la disponibilidad.':`Saldo de planificación: ${integer(c-h)} h.`} Recurrentes: ${m?integer(fixedRecurring(m)+recurringTaskHours(m.id,w)):0} h (${m?fixedRecurring(m):0} fijas + ${m?recurringTaskHours(m.id,w):0} registradas).</p></section><section class="card"><div class="card-header"><h3>Requieren actualización</h3></di function renderProjects(){return `${head('PORTAFOLIO','Proyectos de Ingeniería','Iniciativas, entregables, responsables y resultados.',btn(ic('plus')+' Nuevo proyecto','new-project','primary')+btn(ic('download')+' CSV','export-projects'))}<div class="grid g3">${db.projects.map(p=>{let ts=db.tasks.filter(t=>t.projectId===p.id),done=percentProject(p.id);return `<div class="card"><div class="between">${sb(p.category==='Proyecto de mejora'?'MEJORA':'PROYECTO','blue')}${sb(p.status,p.status==='Finalizado'?'green':p.status==='Cancelado'?'gray':'amber')}</div><h3 class="clickable" data-action="project:${p.id}" style="font-size:17px;margin:16px 0 6px">${esc(p.name)}</h3><p class="muted mini" style="min-height:35px">${esc(p.goal||'Sin objetivo definido')}</p><div class="between mini"><b>Avance de actividades</b><b>${done}%</b></div><div class="progress" style="margin:7px 0 14px"><div class="bar-blue" style="width:${done}%"></div></div><div class="between mini muted"><span>${esc(memberName(p.ownerId))}</span><span>${ts.filter(active).length} activos · ${ts.length} total</span></div><div class="divider"></div><div class="between mini"><span>Compromiso: ${compact(p.due)}</span><button class="mini-link" data-action="project:${p.id}">Abrir proyecto →</button></div></div>`}).join('')||'<div class="card empty">Sin proyectos. Crea el primero para organizar los entregables.</div>'}</div>`}
function memberCard(m,w){let h=loadHours(m.id,w),c=capacity(m,w),r=ratio(h,c);return `<div class="card"><div class="member-head"><div class="flex">${avatar(m.name)}<div><strong>${esc(m.name)}</strong><div class="tiny muted">${esc(m.role||'Ingeniería')}</div></div></div>${loadBadge(r)}</div><div class="between" style="margin-top:18px"><span class="muted mini">${h} h planificadas / ${c} h disponibles</span><b>${r}%</b></div><div class="progress" style="margin:9px 0"><div class="${barColor(r)}" style="width:${Math.min(100,r)}%"></div></div><div class="between mini"><span style="color:${h>c?'var(--red)':'var(--green)'}">${h>c?integer(h-c)+' h excedentes':integer(c-h)+' h libres'}</span><span class="muted">${db.tasks.filter(t=>t.ownerId===m.id&&active(t)).length} tareas activas</span></div><div class="divider"></div><div class="between"><span class="mini muted">${m.weeklyHours} h jornada · ${integer(fixedRecurring(m)+recurringTaskHours(m.id,ui.week))} h recurrentes (${fixedRecurring(m)} fijas + ${recurringTaskHours(m.id,ui.week)} registradas)</span><button class="mini-link" data-action="member:${m.id}">Ver detalle →</button></div></div>`}
function renderTeam(){let w=ui.week,people=db.members.filter(m=>m.active),cap=people.reduce((s,m)=>s+capacity(m,w),0),h=people.reduce((s,m)=>s+loadHours(m.id,w),0);return `${head('PLANIFICACIÓN','Carga y disponibilidad','Las tareas recurrentes descuentan disponibilidad y los proyectos consumen la capacidad restante.',btn(ic('plus')+' Integrante','new-member','primary')+btn('Registrar soporte','new-support')+btn('Simular asignación','simulate'))}<div class="card" style="margin-bottom:16px"><div class="between wrap"><div><b>Semana de planificación</b><div class="muted mini">Distribuye horas de cada actividad por semana, incluso en proyectos largos.</div></div><div class="nav-weeks"><button class="icon-btn" data-action="week:-1" title="Semana anterior">${ic('chevL')}</button><b>${niceWeek(w)}</b><button class="icon-btn" data-action="week:1" title="Semana siguiente">${ic('chevR')}</button><button class="btn small" data-action="week:today">Actual</button></div></div></div><div class="grid g4">${metricCard('Disponibilidad',integer(cap)+' h','Jornada menos tiempo reservado','clock','#2563db')}${metricCard('Carga programada',integer(h)+' h','Horas de actividades activas','tasks','var(--text)')}${metricCard('Saldo neto',integer(cap-h)+' h','No sustituye una revisión individual','team',h>cap?'#c94048':'#18865b')}${metricCard('Con sobrecarga',people.filter(m=>loadHours(m.id,w)>capacity(m,w)).length,'Ingenieros por encima del 100%','alert','#bd741c')}</div><div class="card section"><div class="between wrap"><div><b>Horas recurrentes registradas · ${niceWeek(w)}</b><div class="muted mini">Soporte, reuniones y gestión: descuentan capacidad de la semana seleccionada, además de las horas fijas.</div></div><b>${integer(people.reduce((total,m)=>total+recurringTaskHours(m.id,w),0))} h</b></div></div><div class="section grid g2">${people.map(m=>memberCard(m,w)).join('')||'<div class="card empty">Agrega integrantes al equipo.</div>'}</div><section class="card section"><div class="card-header"><div><h3>Proyección de las próximas seis semanas</h3><p>Horas asignadas / capacidad individual (semana seleccionada y siguientes)</p></div>${btn('Registrar ausencia','new-absence','small')}</div><div class="work-matrix"><table><thead><tr><th>INGENIERO</th>${Array.from({length:6},(_,i)=>`<th class="${i===0?'selected-week':''}">${niceWeek(shift(w,i*7))}</th>`).join('')}</tr></thead><tbody>${people.map(m=>`<tr><td><span class="clickable" data-action="member:${m.id}">${esc(m.name)}</span></td>${Array.from({length:6},(_,i)=>{let wk=shift(w,i*7),a=loadHours(m.id,wk),c=capacity(m,wk),r=ratio(a,c);return `<td class="${i===0?'selected-week':''}"><div class="between" style="min-width:85px"><b>${a}/${c} h</b><span style="color:${r>100?'var(--red)':r>=n(db.settings.hoursWarning)?'var(--amber)':'var(--green)'}">${r}%</span></div><div class="chartbar" style="margin-top:5px"><span class="${barColor(r)}" style="width:${Math.min(100,r)}%"></span></div></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="muted tiny">El soporte recurrente resta horas disponibles; los demás pendientes suman carga. Cada actividad se cuenta una sola vez. Una actividad sin horas semanales no modifica la capacidad.</p></section>`}
function calendarGrid(month,tasks){let [yr,mn]=month.split('-').map(Number),first=new Date(yr,mn-1,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));let cells=Array.from({length:42},(_,i)=>{let dt=new Date(start);dt.setDate(start.getDate()+i);let s=iso(dt),items=tasks.filter(t=>t.due===s);return `<div class="day ${dt.getMonth()!==mn-1?'out':''} ${s===today()?'today':''}"><div class="date">${dt.getDate()}</div>${items.slice(0,3).map(t=>`<span class="cal-item ${overdue(t)?'red':t.status==='Finalizado'?'green':''}" data-action="task:${t.id}" title="${esc(t.title)}">${esc(t.title)}</span>`).join('')}${items.length>3?`<span class="tiny muted">+${items.length-3} más</span>`:''}</div>`});return `<div class="calendar">${['L','M','M','J','V','S','D'].map(d=>`<div class="dayhead">${d}</div>`).join('')}${cells.join('')}</div>`}
function renderCalendar(){let [y,m]=ui.month.split('-').map(Number),items=isAdmin()?db.tasks:db.tasks.filter(t=>t.ownerId===loginUser()?.id);return `${head('PLANIFICACIÓN','Calendario',isAdmin()?'Fechas de entrega y compromisos del departamento.':'Tus compromisos y conexión personal de Outlook.',btn(ic('plus')+' Pendiente','new-task','primary')+btn('Conectar Outlook','outlook-connect:'+(loginUser()?.id||''),'small'))}<div class="card"><div class="card-header"><div class="nav-weeks"><button class="icon-btn" data-action="month:-1">${ic('chevL')}</button><h3 style="text-transform:capitalize">${date(ui.month+'-01').toLocaleDateString('es-GT',{month:'long',year:'numeric'})}</h3><button class="icon-btn" data-action="month:1">${ic('chevR')}</button></div><button class="btn small" data-action="month:today">Hoy</button></div>${calendarGrid(ui.month,items)}<p class="muted tiny">Selecciona un compromiso para ver o actualizar su ficha. Outlook se conectará desde este módulo cuando la autorización corporativa esté habilitada.</p></div>`}
function renderMeetings(){return `${head('SEGUIMIENTO','Reuniones y acuerdos','Documenta decisiones y convierte los acuerdos en compromisos.',btn(ic('plus')+' Nueva reunión','new-meeting','primary'))}<div class="grid g2">${db.meetings.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(mt=>{let t=db.tasks.filter(t=>t.meetingId===mt.id);return `<div class="card"><div class="between">${sb(compact(mt.date),'blue')}${sb(t.length+' acuerdos','gray')}</div><h3 class="clickable" data-action="meeting:${mt.id}" style="margin:14px 0 5px;font-size:17px">${esc(mt.title)}</h3><p class="muted mini">${esc(mt.notes||'Sin descripción')}</p><div class="divider"></div><div class="between mini"><span>${t.filter(x=>x.status==='Finalizado').length} / ${t.length} acuerdos cerrados</span><button class="mini-link" data-action="meeting:${mt.id}">Abrir minuta →</button></div></div>`}).join('')||'<div class="card empty">Aún no hay reuniones registradas.</div>'}</div>`}
function renderReports(){let ts=db.tasks,done=ts.filter(t=>t.status==='Finalizado'),ontime=done.filter(t=>t.completedAt&&iso(t.completedAt.slice(0,10))<=t.originalDue).length,rate=done.length?Math.round(ontime/done.length*100):0,byArea=[...new Set(ts.map(t=>t.requestArea||'Ingeniería'))],byPerson=db.members.map(m=>({name:m.name,num:ts.filter(t=>t.ownerId===m.id&&active(t)).length})),max=Math.max(1,...byPerson.map(x=>x.num));return `${head('RESULTADOS','Indicadores de Ingeniería','Resumen de cumplimiento, ejecución y resultados de proyectos.',btn(ic('download')+' Exportar pendientes','export-tasks')+btn(ic('print')+' Imprimir','print'))}<div class="grid g4">${metricCard('Cerrados',done.length,'Acumulado del registro','check','#18865b')}${metricCard('Cierre puntual',done.length?rate+'%':'—','Sobre pendientes finalizados','calendar','#2563db')}${metricCard('Bloqueados',allActive().filter(t=>t.status==='Bloqueado').length,'Pendientes activos','alert','#c94048')}${metricCard('Vencidos',ts.filter(overdue).length,'Pendientes activos','clock','#bd741c')}</div><div class="section grid g2"><section class="card"><div class="card-header"><h3>Actividades abiertas por ingeniero</h3></div><div class="stack">${byPerson.map(x=>`<div class="report-bardiv"><span>${esc(x.name)}</span><div class="progress"><div class="bar-blue" style="width:${x.num/max*100}%"></div></div><b>${x.num}</b></div>`).join('')}</div><div class="callout" style="margin-top:17px">Esta gráfica muestra cantidad de tareas, no esfuerzo. Para distribuir trabajo, usa las horas del módulo de capacidad.</div></section><section class="card"><div class="card-header"><h3>Solicitudes por área</h3></div><div class="stack">${byArea.map(a=>`<div class="between"><span class="mini">${esc(a)}</span>${sb(ts.filter(t=>(t.requestArea||'Ingeniería')===a).length,'blue')}</div>`).join('')}</div></section></div><div class="section card"><div class="card-header"><h3>Resultados por proyecto</h3>${btn('Exportar CSV','export-projects','small')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>PROYECTO</th><th>RESPONSABLE</th><th>AVANCE*</th><th>AHORRO ESPERADO (Q)</th><th>AHORRO REAL (Q)</th><th>RESULTADO</th></tr></thead><tbody>${db.projects.map(p=>`<tr><td class="title-cell clickable" data-action="project:${p.id}">${esc(p.name)}</td><td>${esc(memberName(p.ownerId))}</td><td>${percentProject(p.id)}%</td><td>${money(p.expectedSavings)}</td><td>${money(p.actualSavings)}</td><td>${esc(p.result||'Sin documentar')}</td></tr>`).join('')}</tbody></table></div><p class="muted tiny">* Avance = actividades finalizadas / actividades registradas. Cierre puntual = cierres hasta la fecha original, sin borrar reprogramaciones. Los ahorros son campos manuales y no se suman automáticamente por posibles duplicidades.</p></div>`}

  <section class="card section"><div class="card-header"><div><h3>Directorio del departamento</h3><p>${db.members.filter(m=>m.active).length} perfiles activos</p></div>${btn(ic('plus')+' Nuevo usuario','new-member','small')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>INTEGRANTE</th><th>USUARIO</th><th>ROL</th><th>OUTLOOK</th><th>ACCIONES</th></tr></thead><tbody>${db.members.map(m=>`<tr><td class="title-cell">${esc(m.name)} ${owner?.id===m.id?sb('Mi perfil','blue'):''}<small>${esc(m.role||'Ingeniería')}</small></td><td><b>@${esc(m.username||'sin usuario')}</b><small>${esc(m.email||'Sin correo Outlook')}</small></td><td>${sb(m.accessRole==='admin'?'Administrador':m.accessRole==='viewer'?'Consulta':'Ingeniero',m.accessRole==='admin'?'blue':'gray')}</td><td>${sb(m.outlookStatus==='connected'?'Conectado':'Sin conectar',m.outlookStatus==='connected'?'green':'gray')}</td><td><div class="flex wrap"><button class="btn small" data-action="edit-member:${esc(m.id)}">Editar / contraseña</button><button class="btn small" data-action="preview-member:${esc(m.id)}">Ver vista</button><button class="btn small" data-action="outlook-connect:${esc(m.id)}">Outlook</button></div></td></tr>`).join('')}</tbody></table></div></section>
  <section class="card section"><div class="card-header"><div><h3>Cómo funcionará al compartirla</h3><p>La interfaz y los usuarios ya están definidos.</p></div>${sb('Modo local actual','amber')}</div><div class="outlook-plan"><div><span class="plan-index">01</span><b>Hoy · sin instalación</b><p>Abres este HTML, inicias sesión y gestionas proyectos, usuarios y cargas desde tu equipo.</p></div><div><span class="plan-index">02</span><b>Después · datos compartidos</b><p>Se conecta una base web para que todos entren desde sus computadoras con los mismos usuarios y datos.</p></div><div><span class="plan-index">03</span><b>Outlook personal</b><p>Cada ingeniero selecciona “Conectar Outlook” en Calendario y autoriza su propia cuenta corporativa.</p></div></div></section>`
}
function renderSettings(){return `${head('ADMINISTRACIÓN','Configuración','Gestiona el almacenamiento, los integrantes y las reglas de planificación.',btn(ic('download')+' Exportar respaldo','backup','primary'))}<div class="grid g2"><section class="card"><div class="card-header"><h3>Parámetros del departamento</h3></div><form id="settingsForm" class="stack"><div class="field"><label>Nombre del departamento</label><input class="input" name="department" required value="${esc(db.settings.department)}"/></div><div class="field"><label>Umbral de carga alta (%)</label><input class="input" name="hoursWarning" type="number" min="1" max="100" required value="${n(db.settings.hoursWarning)}"/><small>La sobrecarga se señala siempre por encima del 100%.</small></div><div class="field"><label>Alerta por inactividad (días)</label><input class="input" name="staleDays" type="number" min="1" max="60" required value="${n(db.settings.staleDays)}"/></div><button class="btn primary" type="submit">${ic('save')} Guardar parámetros</button></form></section><section class="card"><div class="card-header"><h3>Datos y seguridad</h3></div><div class="stack">${btn('Administrar usuarios y roles','view:users','primary')}<div class="modal-note"><b>Almacenamiento compartido activo.</b><br>Integrantes, proyectos, actividades, carga semanal, notas, historial, reuniones, ausencias y parámetros se sincronizan con Supabase. El navegador conserva además una copia local de respaldo.</div>${btn(ic('download')+' Descargar respaldo JSON','backup')}${btn(ic('upload')+' Importar respaldo JSON','import')}${btn('Vaciar todos los registros','clear-all','danger')}<p class="muted tiny">El respaldo incluye integrantes, proyectos, tareas, reuniones, ausencias, fechas e historial. Importar reemplaza los registros locales actuales.</p></div></section><section class="card"><div class="card-header"><h3>Integrantes</h3>${btn(ic('plus')+' Integrante','new-member','small')}</div>${db.members.map(m=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="flex">${avatar(m.name)}<div><b class="mini">${esc(m.name)}</b><div class="tiny muted">${m.weeklyHours} h jornada · ${integer(fixedRecurring(m)+recurringTaskHours(m.id,ui.week))} h recurrentes (${fixedRecurring(m)} fijas + ${recurringTaskHours(m.id,ui.week)} registradas)</div></div></div><button class="btn small" data-action="member:${m.id}">Editar</button></div>`).join('')}</section><section class="card"><div class="card-header"><h3>Ausencias / horas no disponibles</h3>${btn(ic('plus')+' Registrar','new-absence','small')}</div>${db.absences.slice().reverse().map(a=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="mini">${esc(memberName(a.memberId))}<br><span class="muted">${niceWeek(a.week)} · ${esc(a.reason||'Ausencia')}</span></span><span>${a.hours} h <button class="mini-link" data-action="delete-absence:${a.id}">Eliminar</button></span></div>`).join('')||'<div class="empty">Sin ausencias registradas.</div>'}</section></div>`}
function opt(list,val,labeler){return list.map(x=>{let id=typeof x==='string'?x:x.id, title=labeler?labeler(x):typeof x==='string'?x:x.name;return `<option value="${esc(id)}" ${id===val?'selected':''}>${esc(title)}</option>`}).join('')}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input class="input" id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}/></div>`}
function selectField(label,name,options,value='',optional=false){return `<div class="field"><label for="f-${name}">${label}</label><select name="${name}" id="f-${name}">${optional?'<option value="">Ninguno / sin asignar</option>':''}${opt(options,value)}</select></div>`}
function textareaField(label,name,value='',hint=''){return `<div class="field wide"><label for="f-${name}">${label}</label><textarea name="${name}" id="f-${name}">${esc(value)}</textarea>${hint?`<small>${esc(hint)}</small>`:''}</div>`}
function modal(title,body,footer='',wide=false){document.getElementById('modals').innerHTML=`<div class="modal-backdrop" data-action="closeback"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-action="close-modal" aria-label="Cerrar">${ic('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`;}
function closeModal(){document.getElementById('modals').innerHTML=''}
function allocationLine(a={week:ui.week,hours:0},index=0){return `<div class="allocation-row" data-allocation><div><label>Semana que inicia lunes</label><input class="input alloc-week" type="date" value="${esc(a.week||ui.week)}" required/></div><div><label>Horas planificadas</label><input class="input alloc-hours" type="number" min="0" step="0.5" value="${n(a.hours)}" required/></div><button type="button" class="btn danger small" data-action="remove-allocation" title="Eliminar semana">${ic('trash')}</button></div>`}

n}if(key==='my-profile'){if(!adminMember()){toast('Primero marca tu usuario como administrador',true);ui.view='users';render();return}ui.preview=false;db.selectedMember=adminMember().id;save();ui.view='my';render();return}if(key==='set-admin'){let m=mem(id);if(!m)return;db.adminMemberId=id;m.accessRole='admin';db.selectedMember=id;save();render();toast('Tu perfil administrador quedó asignado. Ya puedes entrar a Mi trabajo.');return}if(key==='outlook-connect'){let m=mem(id)||currentMember();if(!isAdmin()&&m?.id!==loginUser()?.id)return;modal('Outlook de '+esc(m?.name||'Ingeniería'),`<div class="stack"><span class="pill amber">Conexión preparada</span><p><b>${esc(m?.name||'El usuario')}</b> conectará su propio Outlook desde este botón.</p><p class="muted mini">La experiencia será: Conectar Outlook → seleccionar cuenta corporativa → autorizar → regresar a INGENIERÍA | CONTROL. La aplicación consultará título, fecha y duración de las reuniones al abrirse.</p><div class="modal-note">No necesitas Python para este flujo. La conexión real se activará cuando tengamos las credenciales de autorización web de Microsoft 365 de la empresa.</div></div>`,`<button class="btn primary" data-action="close-modal">Entendido</button>`);return}if(key==='integration-help'){modal('Activación de acceso compartido y Outlook',`<div class="stack"><p><b>Hoy:</b> puedes trabajar sin Python con cuentas locales dentro de este HTML.</p><p><b>Para compartir:</b> después conectaremos una base web para que todos usen los mismos usuarios y datos desde distintas computadoras.</p><p><b>Outlook:</b> cada ingeniero lo conectará personalmente desde Calendario. No utilizará su contraseña de INGENIERÍA | CONTROL para Outlook.</p><div class="modal-note">La contraseña del sistema y la autorización de Outlook son independientes.</div></div>`);return}if(key==='member'){memberDetail(id);return}if(key==='edit-member'){memberForm(id);return}if(key==='new-meeting'){meetingForm();return}if(key==='meeting'){meetingDetail
